<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>5 สิ่งที่ buddy 2 ชอบ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f4f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
.card{background:#fff;border-radius:20px;padding:2.5rem 2rem;max-width:480px;width:100%}
.avatars{display:flex;justify-content:center;gap:8px;margin:0 auto 1rem}
.avatar{width:56px;height:56px;border-radius:50%;background:#e8e4fb;display:flex;align-items:center;justify-content:center;font-size:28px}
h1{text-align:center;font-size:20px;font-weight:600;color:#1a1a1a;margin-bottom:.25rem}
.sub{text-align:center;font-size:14px;color:#888;margin-bottom:2rem}
ul{list-style:none;display:flex;flex-direction:column;gap:12px}
li{display:flex;align-items:flex-start;gap:12px;background:#f8f7f4;border-radius:12px;padding:14px 16px}
.num{min-width:26px;height:26px;border-radius:50%;background:#5a4fcf;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.text{font-size:15px;color:#1a1a1a;line-height:1.5}
.footer{text-align:center;font-size:12px;color:#bbb;margin-top:2rem}
</style>
</head>
<body>
<div class="card">
  <div class="avatars"><div class="avatar">😅</div></div>
  <h1>5 สิ่งที่ buddy 2 ชอบ</h1>
  <p class="sub">สำหรับน้อง intern ที่น่ารักทุกคน</p>
  <ul>
    <li><span class="num">1</span><span class="text">JS</span></li>
    <li><span class="num">2</span><span class="text">ปิ้งย่าง</span></li>
    <li><span class="num">3</span><span class="text">กาญ</span></li>
    <li><span class="num">4</span><span class="text">เล่นเกม</span></li>
    <li><span class="num">5</span><span class="text">บินได้</span></li>
  </ul>
  <p class="footer">สร้างด้วยความตั้งใจ</p>
</div>
</body>
</html>
